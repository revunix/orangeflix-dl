name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/orangeflix-dl${ext}" ./cmd/orangeflix-dl

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          safe_tag="${TAG//\//-}"
          archive="orangeflix-dl_${safe_tag}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "${archive}.zip" orangeflix-dl.exe)
            rm -f dist/orangeflix-dl.exe
          else
            tar -czf "dist/${archive}.tar.gz" -C dist orangeflix-dl
            rm -f dist/orangeflix-dl
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist

      - name: Generate changelog
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist; create and push it first." >&2
            exit 1
          fi
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="${previous}..${TAG}"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
          else
            range="${TAG}"
            compare=""
          fi
          {
            echo "# Änderungen in ${TAG}"
            echo
            echo "_$(date -u +%Y-%m-%d)_"
            echo
            git log "${range}" --no-merges --pretty=format:'- %s (`%h`)'
            if [ -n "$compare" ]; then
              echo
              echo
              echo "**Vollständiger Diff:** ${compare}"
            fi
          } > dist/CHANGELOG.md

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
            [ "$file" = "checksums.txt" ] && continue
            sha256sum "$file"
          done > checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            # Wird das Tag eines Releases gelöscht und neu gesetzt, macht
            # GitHub das Release wieder zum Entwurf; es wird hier erneut
            # veröffentlicht.
            gh release edit "$TAG" --notes-file dist/CHANGELOG.md --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file dist/CHANGELOG.md
          fi

  packages:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update the package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Nur das neueste Release schreibt die Formel: ein Lauf für ein
          # älteres Tag darf sie nicht zurücksetzen.
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the latest release ($latest); formula left alone."
            exit 0
          fi
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist
          scripts/update-formula.sh "$TAG" dist/checksums.txt
          scripts/update-packages.sh "$TAG" dist/checksums.txt
          git add Formula/orangeflix-dl.rb bucket packaging flake.nix
          if git diff --cached --quiet; then
            echo "Package files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pakete: Manifeste auf ${TAG} aktualisieren"
          git push origin HEAD:main

  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check for a winget token
        id: token
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "WINGET_TOKEN fehlt. winget install funktioniert erst nach einem Pull Request an winget-pkgs."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the winget-pkgs pull request
        if: steps.token.outputs.ok == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Revunix.OrangeflixDl
          installers-regex: 'orangeflix-dl_.+_windows_.+\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  aur:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish the AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY fehlt. Das Paket lässt sich aus packaging/aur bauen, yay findet es erst nach dem ersten Push zum AUR."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          if ! git clone aur@aur.archlinux.org:orangeflix-dl-bin.git aur-repo; then
            echo "Das AUR-Paket orangeflix-dl-bin gibt es noch nicht. Einmal unter https://aur.archlinux.org/submit/ anlegen."
            exit 0
          fi
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          git -C aur-repo config user.name "github-actions[bot]"
          git -C aur-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C aur-repo add PKGBUILD .SRCINFO
          if git -C aur-repo diff --cached --quiet; then
            echo "AUR package already up to date."
            exit 0
          fi
          git -C aur-repo commit -m "Update to ${TAG}"
          git -C aur-repo push
